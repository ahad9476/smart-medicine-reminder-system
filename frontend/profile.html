<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile — Smart Medicine Reminder</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>
        .profile-card {
            max-width: 650px;
        }

        .profile-info {
            margin-bottom: 20px;
        }

        .profile-info label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .profile-info input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        .profile-info input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .profile-readonly {
            background: #f5f7fa;
        }

        .save-profile {
            padding: 10px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .save-profile:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="sidebar-brand">
            Smart Medicine Reminder
        </div>

        <ul class="nav-list">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="medicines.html">Medicines</a></li>
            <li><a href="schedules.html">Schedules</a></li>
            <li><a href="notifications.html">Notifications</a></li>
            <li><a href="caregivers.html">Caregivers</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="profile.html" class="active">Profile</a></li>
        </ul>

        <button class="sidebar-logout" id="logoutBtn">
            Logout
        </button>

    </aside>

    <main class="main">

        <div class="main-header">
            <h1>My Profile</h1>
            <p>View and update your personal information.</p>
        </div>

        <div class="panel profile-card">

            <h2>Profile Information</h2>

            <div class="profile-info">
                <label for="profileName">
                    Name
                </label>

               <input
    type="text"
    id="profileName"
    placeholder="Enter your name"
    maxlength="100"
/>
            </div>

            <div class="profile-info">
                <label for="profileEmail">
                    Email
                </label>

                <input
    type="email"
    id="profileEmail"
    placeholder="Enter your email"
/>
            </div>

            <div class="profile-info">
                <label for="profilePhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="profilePhone"
                    placeholder="e.g. 017XXXXXXXX"
                    maxlength="20"
                />
            </div>

            <button
                type="button"
                class="save-profile"
                id="saveProfileBtn"
            >
                Save Changes
            </button>

        </div>

    </main>

</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
