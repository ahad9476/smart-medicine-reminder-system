<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reminders — Smart Medicine Reminder</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">Smart Medicine Reminder</div>
    <ul class="nav-list">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="medicines.html">Medicines</a></li>
      <li><a href="schedules.html">Schedules</a></li>
      <li><a href="reminders.html" class="active">Reminders</a></li>
      <li><a href="notifications.html">Notifications</a></li>
      <li><a href="caregivers.html">Caregivers</a></li>
      <li><a href="inventory.html">Inventory</a></li>
    </ul>
    <button class="sidebar-logout" id="logoutBtn">Logout</button>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Reminders</h1>
      <p>A log of every dose reminder sent, based on your schedules.</p>
    </div>

    <div class="panel">
      <table class="med-table">
        <thead>
          <tr>
            <th>Medicine</th>
            <th>Scheduled Time</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="reminderRows">
          <tr><td colspan="4" class="empty-state">Loading reminders…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="toast"></div>
<script src="js/api.js"></script>
<script src="js/reminders.js"></script>
</body>
</html>
